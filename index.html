 const t0=Math.min(...ts),t1=Math.max(...ts),span=Math.max(t1-t0,864e5);
 const frac=t=>.07+.83*((t-t0)/span);
 let fr=items.slice(0,nDated).map(i=>i.date?frac(pd(i.date).getTime()):.96);
 for(let k=1;k<fr.length;k++)if(fr[k]-fr[k-1]<.11)fr[k]=fr[k-1]+.11;const mx=Math.max(...fr,0);if(mx>.97)fr=fr.map(f=>.07+(f-.07)*(.9/(mx-.07)));
 // today marker
 const tf=frac(today.getTime());const tp=road.getPointAtLength(L*tf);
 const tg=el('g',{class:'today',opacity:0},svg);el('line',{x1:tp.x,y1:tp.y-rw*1.6,x2:tp.x,y2:tp.y+rw*1.6},tg);
 const tt=el('text',{x:tp.x,y:tp.y-rw*1.9,'text-anchor':'middle','font-size':Math.max(12,H*.018)},tg);tt.textContent='TODAY · '+today.toLocaleDateString('en-US',{month:'short',day:'numeric'});
 setTimeout(()=>tg.animate([{opacity:0},{opacity:1}],{duration:600,fill:'forwards'}),1600);
 nodes=[];const R=Math.max(26,Math.min(W,H)*.05),fs=Math.max(12,Math.min(W,H)*.02);
 items.slice(0,nDated).forEach((it,k)=>{const p=road.getPointAtLength(L*fr[k]);const up=k%2==0;const off=(R*2.2)*(up?-1:1);
  const cx=mob?p.x+(up?-1:1)*R*1.6:p.x,cy=mob?p.y:p.y+off;
  const g=el('g',{class:'bub'+(it.status==='Done'?' done':''),tabindex:0,style:`transform-origin:${cx}px ${cy}px`},svg);
  el('line',{x1:p.x,y1:p.y,x2:cx,y2:cy,stroke:'#5a6370','stroke-width':2,'stroke-dasharray':'4 4'},g);el('circle',{cx:p.x,cy:p.y,r:6,fill:'#f5b400'},g);
  const col=PC[it.priority]||'#5a6370';el('circle',{cx,cy,r:R,class:'ring',stroke:col},g);
  for(let a=0;a<12;a++){const an=a*Math.PI/6;el('line',{x1:cx+Math.cos(an)*(R-2),y1:cy+Math.sin(an)*(R-2),x2:cx+Math.cos(an)*(R+6),y2:cy+Math.sin(an)*(R+6),stroke:col,'stroke-width':4,opacity:.55},g)}
  const ic=el('text',{x:cx,y:cy+R*.28,'text-anchor':'middle','font-size':R*.85,fill:col},g);ic.textContent=SI[it.section]||'●';
  if(it.status==='Done'){el('circle',{cx:cx+R*.72,cy:cy-R*.72,r:R*.34,fill:'#2f9e44'},g);const c=el('text',{x:cx+R*.72,y:cy-R*.6,'text-anchor':'middle','font-size':R*.42,fill:'#fff','font-weight':900},g);c.textContent='✓'}
  const lx=mob?(up?cx-R*1.25:cx+R*1.25):cx,anc=mob?(up?'end':'start'):'middle';
  const ty=mob?cy-4:(up?cy-R-fs*2.2:cy+R+fs*1.6);
  const words=it.title.split(' ');let lines=[''];const maxc=mob?16:24;words.forEach(w=>{if((lines.at(-1)+' '+w).trim().length>maxc)lines.push(w);else lines[lines.length-1]=(lines.at(-1)+' '+w).trim()});lines=lines.slice(0,3);
  const tx=el('text',{x:lx,y:ty-(up&&!mob?(lines.length-1)*fs*1.1:0),'text-anchor':anc,class:'lbl','font-size':fs},g);
  lines.forEach((ln,j)=>{const s=el('tspan',{x:lx,dy:j?fs*1.15:0},tx);s.textContent=ln});
  const dy=mob?ty+lines.length*fs*1.15:(up?ty+fs*1.25:ty+lines.length*fs*1.15);
  const dt=el('text',{x:lx,y:dy,'text-anchor':anc,class:'dt','font-size':fs*.8},g);dt.textContent=fmt(it).toUpperCase();
  g.addEventListener('click',()=>{stopCycle();openP(k)});g.addEventListener('keydown',e=>{if(e.key==='Enter')openP(k)});
  setTimeout(()=>g.classList.add('show'),1500+k*220);nodes.push(g)});
 document.getElementById('foot').textContent=`${items.length} item${items.length==1?'':'s'} · data from Notion, ${new Date(D.fetched_at).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})} PT`;
}

function grpOf(i){const m=(i.details||'').match(/^([^:]{2,30}):/);return m?m[1]:(i.section||'Other')}
const PR={High:0,Medium:1,Low:2};
function drawBL(){const bl=document.getElementById('bl');bl.style.display=items.length>nDated?'block':'none';document.getElementById('svg').style.height=items.length>nDated?'':'100%';const und=items.map((it,k)=>[it,k]).filter(([it])=>!it.date);const g={};
 und.forEach(([it,k])=>{(g[grpOf(it)]=g[grpOf(it)]||[]).push([it,k])});
 bl.innerHTML=`<h3>Backlog · undated <small>${und.length} items — click for details</small></h3><div class="cols">`+Object.entries(g).sort((a,b)=>{const O=['Now','Before first sale','People & money','Product compliance','Operations','Brand & sales','SEMA prep'];const ia=O.indexOf(a[0]),ib=O.indexOf(b[0]);return (ia<0?99:ia)-(ib<0?99:ib)}).map(([n,a])=>`<div class="grp"><h4>${esc(n)} (${a.length})</h4>`+a.sort((x,y)=>(PR[x[0].priority]??3)-(PR[y[0].priority]??3)).map(([it,k])=>`<div class="chipi${it.status==='Done'?' done':''}" data-k="${k}" style="border-color:${PC[it.priority]||'#5a6370'}"><span>${SI[it.section]||'●'}</span><span>${esc(it.title)}${it.status==='Done'?' ✓':''}</span></div>`).join('')+'</div>').join('')+'</div>';
 bl.querySelectorAll('.chipi').forEach(c=>c.onclick=()=>{stopCycle();openP(+c.dataset.k)})}
function openP(k){const it=items[k];active=k;nodes.forEach((n,j)=>n.classList.toggle('active',j===k));document.querySelectorAll('.chipi').forEach(c=>c.classList.toggle('active',+c.dataset.k===k));
 document.getElementById('pc').innerHTML=`<div class="chips"><span class="chip" style="background:${PC[it.priority]||'#3a424d'}">${esc(it.priority||'No priority')}</span><span class="chip">${esc(it.status||'—')}</span><span class="chip">${SI[it.section]||''} ${esc(it.section||'Unsorted')}</span></div>
 <h2>${esc(it.title)}</h2><dl><dt>Date</dt><dd>${fmt(it)}</dd><dt>Section</dt><dd>${esc(it.section||'—')}</dd><dt>Status</dt><dd>${esc(it.status||'—')}</dd><dt>Priority</dt><dd>${esc(it.priority||'—')}</dd>
 <dt>Details</dt><dd>${linkify(it.details)||'—'}</dd><dt>Submitted by</dt><dd>${esc(it.submitted_by||'—')}${it.source?' · via '+esc(it.source):''}</dd></dl>
 ${it.url?`<a class="np" href="${esc(it.url)}" target="_blank" rel="noopener">Open in Notion →</a>`:''}`;document.getElementById('panel').classList.add('open')}
function closeP(){document.getElementById('panel').classList.remove('open');nodes.forEach(n=>n.classList.remove('active'));document.querySelectorAll('.chipi').forEach(c=>c.classList.remove('active'))}
function stopCycle(){clearInterval(timer);timer=null}
const q=new URLSearchParams(location.search);
function startCycle(){const up=items.map((it,k)=>[it,k]).filter(([it])=>it.status!=='Done'&&(!it.date||pd(it.end||it.date)>=today)).map(x=>x[1]);if(!up.length)return;let c=0;
 timer=setInterval(()=>{openP(up[c%up.length]);c++;setTimeout(()=>{if(timer)closeP()},9000)},12000)}
draw();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
if(q.has('cycle'))setTimeout(startCycle,4000);if(q.has('open'))setTimeout(()=>openP(+q.get('open')||0),3200);
addEventListener('keydown',e=>{if(e.key==='Escape')closeP()});
</script></body></html>
