<style>
:root{--bg:#121417;--panel:#1c2026;--steel:#2a3038;--line:#3a424d;--txt:#e8ecf1;--mut:#8b95a3;--acc:#f5b400;--hi:#e5383b;--med:#f59f00;--low:#8d96a0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 20% 0%,#1d232b 0,transparent 60%),repeating-linear-gradient(45deg,#14171b 0 14px,#121417 14px 28px)}
header{display:flex;align-items:center;justify-content:space-between;padding:1.6vh 2.5vw;border-bottom:3px solid var(--acc);background:linear-gradient(#1a1e24,#14171b)}
.brand{display:flex;align-items:center;gap:1vw}.logo{width:clamp(34px,4vh,56px);height:clamp(34px,4vh,56px)}
h1{margin:0;font-size:clamp(20px,3.4vh,44px);letter-spacing:.08em;text-transform:uppercase;font-weight:800}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:clamp(11px,1.5vh,18px);letter-spacing:.15em;text-transform:uppercase}
.legend{display:flex;gap:1.4vw;flex-wrap:wrap;font-size:clamp(11px,1.5vh,17px);color:var(--mut)}.legend i{display:inline-block;width:.9em;height:.9em;border-radius:50%;margin-right:.35em;vertical-align:-1px}
#stage{position:absolute;top:0;left:0;right:0;bottom:0}main{position:relative;height:calc(100% - var(--hh,90px))}
svg{width:100%;height:100%;display:block}
.road{fill:none;stroke:#2b3139;stroke-linecap:round}.road-edge{fill:none;stroke:#454e5a;stroke-linecap:round}
.dash{fill:none;stroke:var(--acc);stroke-dasharray:18 22;stroke-linecap:round;animation:drive 2.5s linear infinite}@keyframes drive{to{stroke-dashoffset:-40}}
.bub{cursor:pointer;opacity:0;transition:transform .3s}.bub.show{animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}@keyframes pop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
.bub .ring{fill:var(--panel);stroke-width:5}.bub.done{filter:saturate(.25) brightness(.75)}
.bub.active .ring{stroke:#fff!important;filter:drop-shadow(0 0 14px var(--acc))}
.lbl{fill:var(--txt);font-weight:700}.dt{fill:var(--mut);font-weight:600;letter-spacing:.05em}
.today line{stroke:var(--acc);stroke-width:3;stroke-dasharray:6 6}.today text{fill:var(--acc);font-weight:800;letter-spacing:.15em}

#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mut);font-size:22px}

 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 document.title=l==='zh'?'TireGoods 路线图':'TireGoods Roadmap';const a=active;closeP();draw();if(a>=0&&document.getElementById('panel').dataset.o==='1')openP(a)}
const PC={High:'#e5383b',Medium:'#f59f00',Low:'#8d96a0'};const SI={'Company stage':'◆','Upcoming event':'★','App needing work':'⚙','Ongoing project':'▲','Other':'●'};
const ALL=D.items.filter(i=>i.title&&!/^test[-\s_]?\d*$/i.test(i.title.trim())).sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);
const items=ALL.filter(i=>i.date).concat(ALL.filter(i=>!i.date));const nDated=items.filter(i=>i.date).length;
const today=new Date();today.setHours(0,0,0,0);const pd=s=>{const[y,m,d]=s.split('-');return new Date(+y,m-1,+d)};
const fmt=(i)=>{if(!i.date)return t('Unscheduled');const o={month:'short',day:'numeric',year:'numeric'};let s=pd(i.date).toLocaleDateString(loc(),o);if(i.end)s=pd(i.date).toLocaleDateString(loc(),{month:'short',day:'numeric'})+' – '+pd(i.end).toLocaleDateString(loc(),o);return s};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify=s=>esc(s).replace(/https?:\/\/[^\s)]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
let nodes=[],active=-1,timer=null;const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function draw(){
 document.getElementById('main').style.setProperty('--hh','0px');const hh=document.getElementById('hdr').offsetHeight;document.getElementById('main').style.height=(innerHeight-hh)+'px';
 const svg=document.getElementById('svg');svg.innerHTML='';drawBL();const W=svg.clientWidth,H=svg.clientHeight;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 document.getElementById('empty').style.display=items.length?'none':'flex';
 const mob=W<700,n=Math.max(items.length,1);
 // build winding path: horizontal serpentine (desktop) or vertical (mobile)
 const pts=[];const segs=60;
 for(let k=0;k<=segs;k++){const t=k/segs;if(!mob){pts.push([W*.06+t*W*.88,H*.55+Math.sin(t*Math.PI*2.4)*H*.22])}else{pts.push([W*.5+Math.sin(t*Math.PI*3)*W*.26,H*.06+t*H*.88])}}
 let d='M'+pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' L');
 const rw=Math.max(18,Math.min(W,H)*.045);
 el('path',{d,class:'road-edge','stroke-width':rw+8},svg);const road=el('path',{d,class:'road','stroke-width':rw},svg);
 const L=road.getTotalLength();[svg.lastChild,svg.firstChild].forEach(p=>{p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:1800,fill:'forwards',easing:'ease-in-out'})});
 const dash=el('path',{d,class:'dash','stroke-width':3,opacity:0},svg);setTimeout(()=>dash.setAttribute('opacity',.8),1700);
 // positions: date-proportional between min/max with min spacing; unscheduled at end
 const dated=items.filter(i=>i.date);const ts=dated.map(i=>pd(i.date).getTime()).concat([today.getTime()]);
 const t0=Math.min(...ts),t1=Math.max(...ts),span=Math.max(t1-t0,864e5);
 const frac=t=>.07+.83*((t-t0)/span);
 let fr=items.slice(0,nDated).map(i=>i.date?frac(pd(i.date).getTime()):.96);
 for(let k=1;k<fr.length;k++)if(fr[k]-fr[k-1]<.11)fr[k]=fr[k-1]+.11;const mx=Math.max(...fr,0);if(mx>.97)fr=fr.map(f=>.07+(f-.07)*(.9/(mx-.07)));
 // today marker
 const tf=frac(today.getTime());const tp=road.getPointAtLength(L*tf);
 const tg=el('g',{class:'today',opacity:0},svg);el('line',{x1:tp.x,y1:tp.y-rw*1.6,x2:tp.x,y2:tp.y+rw*1.6},tg);
 const tt=el('text',{x:tp.x,y:tp.y-rw*1.9,'text-anchor':'middle','font-size':Math.max(12,H*.018)},tg);tt.textContent=t('TODAY')+' · '+today.toLocaleDateString(loc(),{month:'short',day:'numeric'});
 setTimeout(()=>tg.animate([{opacity:0},{opacity:1}],{duration:600,fill:'forwards'}),1600);
 nodes=[];const R=Math.max(26,Math.min(W,H)*.05),fs=Math.max(12,Math.min(W,H)*.02);
 items.slice(0,nDated).forEach((it,k)=>{const p=road.getPointAtLength(L*fr[k]);const up=k%2==0;const off=(R*2.2)*(up?-1:1);
  const cx=mob?p.x+(up?-1:1)*R*1.6:p.x,cy=mob?p.y:p.y+off;
  const g=el('g',{class:'bub'+(it.status==='Done'?' done':''),tabindex:0,style:`transform-origin:${cx}px ${cy}px`},svg);
  el('line',{x1:p.x,y1:p.y,x2:cx,y2:cy,stroke:'#5a6370','stroke-width':2,'stroke-dasharray':'4 4'},g);el('circle',{cx:p.x,cy:p.y,r:6,fill:'#f5b400'},g);
  const col=PC[it.priority]||'#5a6370';el('circle',{cx,cy,r:R,class:'ring',stroke:col},g);
  for(let a=0;a<12;a++){const an=a*Math.PI/6;el('line',{x1:cx+Math.cos(an)*(R-2),y1:cy+Math.sin(an)*(R-2),x2:cx+Math.cos(an)*(R+6),y2:cy+Math.sin(an)*(R+6),stroke:col,'stroke-width':4,opacity:.55},g)}
  const ic=el('text',{x:cx,y:cy+R*.28,'text-anchor':'middle','font-size':R*.85,fill:col},g);ic.textContent=SI[it.section]||'●';
  if(it.status==='Done'){el('circle',{cx:cx+R*.72,cy:cy-R*.72,r:R*.34,fill:'#2f9e44'},g);const c=el('text',{x:cx+R*.72,y:cy-R*.6,'text-anchor':'middle','font-size':R*.42,fill:'#fff','font-weight':900},g);c.textContent='✓'}
  const lx=mob?(up?cx-R*1.25:cx+R*1.25):cx,anc=mob?(up?'end':'start'):'middle';
  const ty=mob?cy-4:(up?cy-R-fs*2.2:cy+R+fs*1.6);
  const maxc=mob?16:24;const wd=x=>[...x].reduce((n,c)=>n+(/[\u2e80-\uffef]/.test(c)?2:1),0);const toks=TT(it).match(/[\u2e80-\uffef]|[^\s\u2e80-\uffef]+|\s+/g)||[''];let lines=[''];toks.forEach(w=>{if(wd(lines.at(-1)+w)>maxc&&lines.at(-1).trim()){lines.push(w.trim())}else lines[lines.length-1]+=w});lines=lines.map(l=>l.trim()).slice(0,3);
  const tx=el('text',{x:lx,y:ty-(up&&!mob?(lines.length-1)*fs*1.1:0),'text-anchor':anc,class:'lbl','font-size':fs},g);
  lines.forEach((ln,j)=>{const s=el('tspan',{x:lx,dy:j?fs*1.15:0},tx);s.textContent=ln});
  const dy=mob?ty+lines.length*fs*1.15:(up?ty+fs*1.25:ty+lines.length*fs*1.15);
  const dt=el('text',{x:lx,y:dy,'text-anchor':anc,class:'dt','font-size':fs*.8},g);dt.textContent=LANG==='zh'?fmt(it):fmt(it).toUpperCase();
  g.addEventListener('click',()=>{stopCycle();openP(k)});g.addEventListener('keydown',e=>{if(e.key==='Enter')openP(k)});
  setTimeout(()=>g.classList.add('show'),1500+k*220);nodes.push(g)});
 document.getElementById('foot').textContent=(LANG==='zh'?`${items.length} 项 · 数据来自 Notion，`:`${items.length} item${items.length==1?'':'s'} · data from Notion, `)+`${new Date(D.fetched_at).toLocaleString(loc(),{dateStyle:'medium',timeStyle:'short'})} PT`;
}

function grpOf(i){const m=(i.details||'').match(/^([^:]{2,30}):/);return m?m[1]:(i.section||'Other')}
const PR={High:0,Medium:1,Low:2};
function drawBL(){const bl=document.getElementById('bl');bl.style.display=items.length>nDated?'block':'none';document.getElementById('svg').style.height=items.length>nDated?'':'100%';const und=items.map((it,k)=>[it,k]).filter(([it])=>!it.date);const g={};
 und.forEach(([it,k])=>{(g[grpOf(it)]=g[grpOf(it)]||[]).push([it,k])});
 bl.innerHTML=`<h3>${t('Backlog · undated')} <small>${LANG==='zh'?und.length+' 项 — '+t('click'):und.length+' items — click for details'}</small></h3><div class="cols">`+Object.entries(g).sort((a,b)=>{const O=['Now','Before first sale','People & money','Product compliance','Operations','Brand & sales','SEMA prep'];const ia=O.indexOf(a[0]),ib=O.indexOf(b[0]);return (ia<0?99:ia)-(ib<0?99:ib)}).map(([n,a])=>`<div class="grp"><h4>${esc(t(n))} (${a.length})</h4>`+a.sort((x,y)=>(PR[x[0].priority]??3)-(PR[y[0].priority]??3)).map(([it,k])=>`<div class="chipi${it.status==='Done'?' done':''}" data-k="${k}" style="border-color:${PC[it.priority]||'#5a6370'}"><span>${SI[it.section]||'●'}</span><span>${esc(TT(it))}${it.status==='Done'?' ✓':''}</span></div>`).join('')+'</div>').join('')+'</div>';
 bl.querySelectorAll('.chipi').forEach(c=>c.onclick=()=>{stopCycle();openP(+c.dataset.k)})}
function openP(k){const it=items[k];active=k;nodes.forEach((n,j)=>n.classList.toggle('active',j===k));document.querySelectorAll('.chipi').forEach(c=>c.classList.toggle('active',+c.dataset.k===k));
 document.getElementById('pc').innerHTML=`<div class="chips"><span class="chip" style="background:${PC[it.priority]||'#3a424d'}">${esc(t(it.priority||'No priority'))}</span><span class="chip">${esc(t(it.status||'—'))}</span><span class="chip">${SI[it.section]||''} ${esc(t(it.section||'Unsorted'))}</span></div>
 <h2>${esc(TT(it))}</h2><dl><dt>${t('Date')}</dt><dd>${fmt(it)}</dd><dt>${t('Section')}</dt><dd>${esc(t(it.section||'—'))}</dd><dt>${t('Status')}</dt><dd>${esc(t(it.status||'—'))}</dd><dt>${t('Priority')}</dt><dd>${esc(t(it.priority||'—'))}</dd>
 <dt>${t('Details')}</dt><dd>${linkify(TD(it))||'—'}</dd><dt>${t('Submitted by')}</dt><dd>${esc(it.submitted_by||'—')}${it.source?' · '+t('via')+' '+esc(t(it.source)):''}</dd></dl>
 ${it.url?`<a class="np" href="${esc(it.url)}" target="_blank" rel="noopener">${t('Open in Notion →')}</a>`:''}`;const P=document.getElementById('panel');P.classList.add('open');P.dataset.o='1'}
function closeP(){const P=document.getElementById('panel');P.classList.remove('open');P.dataset.o='';active=-1;nodes.forEach(n=>n.classList.remove('active'));document.querySelectorAll('.chipi').forEach(c=>c.classList.remove('active'))}
function stopCycle(){clearInterval(timer);timer=null}
const q=new URLSearchParams(location.search);
function startCycle(){const up=items.map((it,k)=>[it,k]).filter(([it])=>it.status!=='Done'&&(!it.date||pd(it.end||it.date)>=today)).map(x=>x[1]);if(!up.length)return;let c=0;
 timer=setInterval(()=>{openP(up[c%up.length]);c++;setTimeout(()=>{if(timer)closeP()},9000)},12000)}
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{const a=active,o=document.getElementById('panel').dataset.o==='1';setLang(b.dataset.l);if(o&&a>=0)openP(a)});setLang(LANG);let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
if(q.has('cycle'))setTimeout(startCycle,4000);if(q.has('open'))setTimeout(()=>openP(+q.get('open')||0),3200);
addEventListener('keydown',e=>{if(e.key==='Escape')closeP()});
</script></body></html>
